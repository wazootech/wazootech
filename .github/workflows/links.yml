# Map upkeep for wazootech/wazootech.
#
# This is the whole point of the repository: upkeep is a scheduled job, not
# something anyone has to remember. It files a single tracking issue with the
# diff rather than failing silently, so the map is always someone's next action.
#
# CREDENTIALS: no setup required. The automatic GITHUB_TOKEN is sufficient,
# because this is a public map and every repository it inspects is public.
#
# This was not believed at first. An earlier version of this comment claimed the
# automatic token could not read the organization at all, and required a
# GH_ORG_TOKEN secret. That was wrong: such a token reads public repositories
# fine and simply cannot see private ones — which this repository deliberately
# ignores. Measured on a real run, the automatic token completed both steps.
#
# GH_ORG_TOKEN is still honoured as an override, and both scripts still verify
# that the organization listing is complete before trusting it. If a token ever
# cannot list the organization's public repositories, both steps exit 2 naming
# what they could not see, rather than reporting a confident false result.
#
# No setup steps: node and gh are both preinstalled on the runner, and this
# repository has no dependencies to install.

name: Map upkeep

on:
  schedule:
    # Mondays, 06:17 UTC. An off-round minute, so this does not pile onto the
    # top-of-hour crowd that every other scheduled workflow in the org shares.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - INSTALL.md
      - AGENTS.md
      # The upkeep logic is part of the surface it checks. A fix to the radar
      # that cannot itself be validated is how a radar quietly stops working;
      # this filter originally listed only the prose files, so editing
      # scripts/ ran nothing at all.
      - "scripts/**"
      - ".github/workflows/links.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: map-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_ORG_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check generated files are current
        run: node scripts/generate.mjs --check

      - name: Check links and file the drift issue
        # Runs even if the previous step failed: a stale inventory and a broken
        # link are independent problems and both deserve to be reported.
        if: always()
        run: node scripts/check-links.mjs --file-issue
